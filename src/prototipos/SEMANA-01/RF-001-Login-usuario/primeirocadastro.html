<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Cadastro - Controle de estoque</title>

    <style>
        * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Poppins', Arial, sans-serif;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background-image: url(img/login.png);
    background-size: cover;
    background-position: center; 
  }

 

  .cadastro-card {
    background-color: rgba(252, 216, 182, 0.9);
    width: 420px;
    max-width: 90%;
    padding: 40px 32px;
    border-radius: 16px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
  }

  .cadastro-card .logo {
    mix-blend-mode: multiply;
    display: block;
    width: 290px;
    margin: 0 auto 20px;
}

  .cadastro-card h2 {
    color: #494d55;
    font-size: 22px;
    text-align: center;
    margin-bottom: 24px;
    font-weight: 500;
    font-family:'Poppins', Arial, sans-serif
  }


  .cadastro-fields {
    margin-bottom: 18px;
  }


  .field label {
    display: block;
    font-size: 13px;
    color: #463e30;
    margin-bottom: 6px;
    font-weight: 600;
  }

  .field input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid rgba(112, 49, 1, 0.459);
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
    background-color: rgba(250, 248, 246, 0.925);
  }

  .field input:focus {
    border-color: #d49919;
    box-shadow: 0 0 0 3px rgba(214, 157, 34, 0.15);
  }

  .btn-login {
    width: 100%;
    padding: 12px;
    background: #ffae58;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 20px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }

  .btn-login:hover {
    background: #d68d21;
  }
    </style>
    
</head>

<body>

    <div class="cadastro-card">
        <img src="img/logo.jfif" alt="Logo" class="logo">
        <h2>Cadastre o administrador do sistema</h2>

        <form id="formCadastro">
 <!-- Campos do login -->           
            <div class="cadastro-fields">
                <div class="field">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" placeholder="Digite o nome" required>
                </div>
            </div>
            
            <div class="cadastro-fields">
                <div class="field">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="Digite o e-mail" required>
                </div>
            </div>
             
            <div class="cadastro-fields">
                <div class="field">
                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" placeholder="Digite o telefone" required>

                </div>
            </div>
            <div class="cadastro-fields">
               <div class="field">    
                   <label for="senha">Senha</label>
                  <input type="password" id="senha" placeholder="Digite a senha" required>
               </div>
            </div>
            <div class="cadastro-fields">
                <div class="field">
                    <label for="confirmarSenha">Confirmar senha</label>
                    <input type="password" id="confirmarSenha" placeholder="Confirme a senha" required>
                </div>
            </div>

            <button class="btn-login" type="submit">CRIAR</button>
        </form>
    </div>
    

    <script>
//JS
    const formCadastro = document.getElementById("formCadastro");

    formCadastro.addEventListener("submit", function(event) {
    event.preventDefault();

  const nome = document.getElementById("nome").value.trim();
  const email = document.getElementById("email").value.trim();
  const telefone = document.getElementById("telefone").value.trim();
  const senha = document.getElementById("senha").value;
  const confirmarSenha = document.getElementById("confirmarSenha").value;

  if (senha !== confirmarSenha) {
    alert("As senhas não coincidem.");
    return;
  }

 // Recupera a lista de administradores (ou cria uma vazia)
  const administradores = JSON.parse(localStorage.getItem("administradores")) || [];

  // Verifica duplicidade de e-mail (case-insensitive)
  const emailJaExiste = administradores.some(
    admin => admin.email.toLowerCase() === email.toLowerCase()
  );

  if (emailJaExiste) {
    alert("Este e-mail já está cadastrado.");
    return;
  }

  // Adiciona o novo administrador à lista
  administradores.push({ nome, email, telefone, senha });
  localStorage.setItem("administradores", JSON.stringify(administradores));

  alert("Cadastro realizado com sucesso!");
  window.location.href = "login.html";
});
    </script>

</body>
</html>
